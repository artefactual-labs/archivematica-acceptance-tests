---
name: "Test"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "qa/**"
      - "stable/**"
jobs:
  test-virtualenv:
    name: "Test Python ${{ matrix.python-version }} (virtualenv)"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
        ]
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - name: "Set up Python"
        uses: "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405" # v6.2.0
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: "Install requirements"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: "Run test"
        run: |
          ./simplebrowsertest.py
  test-docker:
    name: "Test Python ${{ matrix.python-version }} (docker)"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
        ]
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd" # v4.0.0
      - name: "Build the archivematica-acceptance-tests image"
        uses: "docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f" # v7.1.0
        with:
          target: "archivematica-acceptance-tests"
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          tags: "archivematica-acceptance-tests:latest"
          push: false
          load: true
          cache-from: "type=gha,scope=archivematica-acceptance-tests-${{ matrix.python-version }}"
          cache-to: "type=gha,scope=archivematica-acceptance-tests-${{ matrix.python-version }},mode=max"
      - name: "Run test"
        run: |
          docker run \
            --rm \
            --security-opt="seccomp=unconfined" \
            archivematica-acceptance-tests \
            /home/artefactual/acceptance-tests/simplebrowsertest.py
  lint:
    name: "Lint"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - name: "Set up Python"
        uses: "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405" # v6.2.0
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: "Install tox"
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: "Run tox"
        run: |
          tox -e linting
