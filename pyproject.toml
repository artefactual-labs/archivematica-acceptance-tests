[project]
name = "archivematica-acceptance-tests"
description = "Archivematica Automated User Acceptance Tests (AMAUAT)"
requires-python = ">=3.10"
# The project.version field is required in pyproject.toml files, even if this
# project is not yet versioned. Using a placeholder for now.
version = "0.0.0"
dependencies = [
  "amclient",
  "bagit",
  "behave",
  "lxml",
  "metsrw",
  "pexpect",
  "requests",
  "selenium",
  "tenacity",
]

[project.optional-dependencies]
dev = [
  "pip-tools",
  "ruff",
  "tox",
]

[tool.ruff.lint]
# Rule reference: https://docs.astral.sh/ruff/rules/
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "UP",
  "W",
]
ignore = [
  "B904",
  "E501",
  "F811",
  "UP031",
]

[tool.ruff.lint.isort]
force-single-line = true

[[tool.mypy.overrides]]
module = ["features.steps.*"]
disable_error_code = "no-redef"

[tool.tox]
legacy_tox_ini = """
    [tox]
    skipsdist = True
    envlist = linting

    [testenv]
    skip_install = True

    [testenv:linting]
    basepython = python3
    deps = pre-commit
    commands = pre-commit run --all-files --show-diff-on-failure
"""
