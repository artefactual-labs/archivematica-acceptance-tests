[project]
name = "archivematica-acceptance-tests"
description = "Archivematica Automated User Acceptance Tests (AMAUAT)"
requires-python = ">=3.10"
# The project.version field is required in pyproject.toml files, even if this
# project is not yet versioned. Using a placeholder for now.
version = "0.0.0"
dependencies = [
  "amclient>=1.7.0",
  "behave",
  "lxml",
  "metsrw",
  "pexpect",
  "requests",
  "playwright",
  "tenacity",
]

[dependency-groups]
dev = [
  "pre-commit",
  "ruff",
]

[tool.uv]
# This repository is a test suite, not an installable Python package.
package = false
# Keep compatibility with newer global uv installations used by deployments.
# GitHub Actions reads this value automatically via astral-sh/setup-uv.
required-version = ">=0.11.30"

[tool.ruff.lint]
# Rule reference: https://docs.astral.sh/ruff/rules/
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "UP",
  "W",
]
ignore = [
  "B904",
  "E501",
  "F811",
  "UP031",
]

[tool.ruff.lint.isort]
force-single-line = true

[[tool.mypy.overrides]]
module = ["features.steps.*"]
disable_error_code = "no-redef"
